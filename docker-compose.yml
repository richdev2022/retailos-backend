version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: retailos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retailos
      POSTGRES_PASSWORD: retailos
      POSTGRES_DB: retailos
    ports:
      - '5432:5432'
    volumes:
      - retailos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U retailos -d retailos']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: retailos-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - retailos-redis:/data

volumes:
  retailos-pgdata:
  retailos-redis:
